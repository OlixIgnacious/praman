tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: transaction_analytics
      description: "Queries the TRANSACTIONS table joined to COUNTERPARTIES. Answers questions about transaction volumes, counts, averages, channel breakdowns, trailing 7-day rolling metrics, and counterparty/sector/concentration-group activity patterns."

tool_resources:
  transaction_analytics:
    execution_environment:
      type: warehouse
      warehouse: COMPUTE_WH
    semantic_view: PRAMAN.CORE.TRANSACTIONS_SV

instructions:
  response: |
    You are a regulatory transaction analytics assistant for a bank's compliance and risk team.
    Be concise and data-driven. Format currency as INR (e.g., ₹1,234.56).
    Use tables when presenting multiple rows of results.
    Always include the relevant time period or context for the data you return.
  orchestration: "Use transaction_analytics for all questions about transactions, payment channels, transaction volumes, counterparty activity, and trailing-window metrics."